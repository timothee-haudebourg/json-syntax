[package]
name = "json-syntax"
version = "0.12.5"
edition = "2021"
authors = ["Timothée Haudebourg <author@haudebourg.net>"]
description = "Strict JSON parsing and mapping library"
categories = ["parsing", "data-structures"]
keywords = ["parsing", "json", "rfc", "mapping"]
repository = "https://github.com/timothee-haudebourg/json-syntax"
documentation = "https://docs.rs/json-syntax"
license = "MIT/Apache-2.0"
readme = "README.md"
rust-version = "1.71.0"

[features]
default = ["serde"]

## JSON Canonicalization Scheme (JCS) implementation.
canonicalize = ["dep:ryu-js"]

## Serialization/Deserialization support using `serde`.
serde = ["dep:serde", "smallstr/serde"]

## Compatibility layer with the `serde_json` crate.
serde_json = ["dep:serde_json"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# json-number = { version = "0.4", features = ["smallnumberbuf"] }
# json-number = { path = "/home/work/Documents/Community/JSON/number/" }
smallvec = "1.9"
smallstr = "0.3"
locspan = "0.9"
lexical = { version = "7.0.1", features = [ "format" ] }
# indexmap = "1.9.1"
decoded-char = "0.1"
# hashbrown = { version = "0.12.1", features = ["raw"] }
btree-indexmap.path = "/home/work/Documents/Community/Utils/data-structures/btree-indexmap/"
utf8-decode = "1.0.1"

# Canonicalization.
ryu-js = { version = "0.2.2", optional = true }

# Compatibility with `serde`.
serde = { version = "1.0", optional = true }

# Compatibility with `serde_json`.
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }

[[example]]
name = "serde"
required-features = ["serde"]

[[example]]
name = "serde_json"
required-features = ["serde_json"]
